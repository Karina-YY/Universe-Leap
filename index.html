<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <title>瞬息全宇宙：逃离贝果</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090909;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff7df;
      touch-action: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app {
      position: relative;
      width: min(100vw, calc(100vh * 0.5625));
      height: min(100vh, calc(100vw / 0.5625));
      max-width: 720px;
      max-height: 1280px;
      overflow: hidden;
      background: #111;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0f0f12;
      touch-action: none;
    }

    #fatal-error {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
      background: rgba(0, 0, 0, 0.86);
      color: #fff7df;
      font-size: 28px;
      line-height: 1.5;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" width="720" height="1280" aria-label="瞬息全宇宙：逃离贝果"></canvas>
    <div id="fatal-error">哎呀，出错了，请重启试试吧~</div>
  </div>

  <script src="js/levels/universeParams.js"></script>
  <script src="js/levels/mapTemplates.js"></script>
  <script src="js/gameplay/utils.js"></script>
  <script src="js/gameplay/input.js"></script>
  <script src="js/gameplay/entities.js"></script>
  <script src="js/gameplay/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
