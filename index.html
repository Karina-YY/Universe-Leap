<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>瞬息全宇宙：逃离贝果 - 离线 Canvas 骨架</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050814;
      --panel: rgba(8, 13, 32, 0.82);
      --line: rgba(111, 206, 255, 0.24);
      --accent: #ffbf69;
      --accent-2: #74f2ce;
      --text: #f5f7ff;
      --muted: rgba(245, 247, 255, 0.66);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(31, 66, 146, 0.28), transparent 30%),
        radial-gradient(circle at 80% 18%, rgba(52, 115, 119, 0.22), transparent 24%),
        radial-gradient(circle at 50% 120%, rgba(139, 48, 84, 0.18), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding:
        env(safe-area-inset-top, 0)
        env(safe-area-inset-right, 0)
        env(safe-area-inset-bottom, 0)
        env(safe-area-inset-left, 0);
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    #game-canvas {
      display: block;
      background: #040712;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.48),
        0 0 0 1px rgba(255, 255, 255, 0.02) inset,
        0 0 30px rgba(116, 242, 206, 0.08);
      touch-action: manipulation;
    }

    .overlay {
      position: absolute;
      top: max(20px, env(safe-area-inset-top, 0));
      left: 50%;
      transform: translateX(-50%);
      width: min(420px, calc(100vw - 32px));
      padding: 16px 18px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(10, 15, 37, 0.92), var(--panel));
      backdrop-filter: blur(10px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .overlay--hidden {
      opacity: 0;
      transform: translate(-50%, -8px);
      pointer-events: none;
    }

    .overlay__eyebrow {
      margin: 0 0 6px;
      color: var(--accent-2);
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .overlay__title {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.2;
    }

    .overlay__status {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-line;
      text-align: center;
    }

    @media (max-width: 820px) {
      #app {
        padding: 12px;
      }

      #game-canvas {
        border-radius: 20px;
        box-shadow:
          0 16px 48px rgba(0, 0, 0, 0.42),
          0 0 0 1px rgba(255, 255, 255, 0.02) inset;
      }

      .overlay {
        top: max(12px, env(safe-area-inset-top, 0));
        width: min(360px, calc(100vw - 24px));
        padding: 14px 16px;
      }

      .overlay__eyebrow {
        font-size: 11px;
      }

      .overlay__title {
        font-size: 20px;
        text-align: center;
      }

      .overlay__status {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" width="1280" height="720" aria-label="Canvas 游戏舞台"></canvas>
    <div class="overlay" id="status-overlay">
      <p class="overlay__eyebrow">Offline Canvas Skeleton</p>
      <h1 class="overlay__title">瞬息全宇宙：逃离贝果</h1>
      <p class="overlay__status" id="status-text">准备初始化...</p>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
